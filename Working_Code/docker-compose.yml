services:
  mongo:
    image: mongo:7
    container_name: feedflash-mongo
    ports:
      - "27017:27017"
    volumes:
      - feedflash_mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: feedflash-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - feedflash_redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Infrastructure/server/Dockerfile
    container_name: feedflash-backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/feedflash
      REDIS_URL: redis://redis:6379/0
      FINVIZ_AUTH_TOKEN: ${FINVIZ_AUTH_TOKEN:-}
      NODE_ENV: development
    depends_on:
      - mongo
      - redis

  rss-worker:
    build:
      context: .
      dockerfile: Dockerfile.rss
    container_name: feedflash-rss-worker
    environment:
      MONGODB_URI: mongodb://mongo:27017/feedflash
      MONGO_DB: feedflash
      REDIS_URL: redis://redis:6379/0
      FINVIZ_AUTH_TOKEN: ${FINVIZ_AUTH_TOKEN:-}
    depends_on:
      - mongo
      - redis
    profiles:
      - worker

  sentiment-worker:
    build:
      context: .
      dockerfile: Dockerfile.sentiment
    container_name: feedflash-sentiment-worker
    environment:
      MONGODB_URI: mongodb://mongo:27017/feedflash
      MONGO_DB: feedflash
      REDIS_URL: redis://redis:6379/0
      FINVIZ_AUTH_TOKEN: ${FINVIZ_AUTH_TOKEN:-}
      FINBERT_MODEL: ProsusAI/finbert
    volumes:
      - hf_sentiment_cache:/tmp/hf_cache
    depends_on:
      - mongo
      - redis
    profiles:
      - worker

volumes:
  hf_sentiment_cache:
  feedflash_mongo_data:
  feedflash_redis_data:
